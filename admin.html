<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4eadb">
<title>Administration - ADZAKO</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;font-family:Arial,sans-serif;background:#fbf7f0;color:#332b22}
main{max-width:520px;margin:35px auto;background:#fff;padding:25px;border:1px solid #eadcc8;border-radius:14px;box-shadow:0 4px 16px #332b2212}
h1{color:#8f682e;text-align:center;letter-spacing:2px}h2{font-size:20px}
label{display:block;margin:14px 0 6px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #cdbb9e;border-radius:7px;font-size:16px}
button{width:100%;margin-top:18px;padding:13px;background:#b58a45;color:#fff;border:0;border-radius:7px;font-weight:bold;font-size:16px}
button:disabled{opacity:.6}#message{padding:12px;background:#f4eadb;border-radius:7px;white-space:pre-wrap}
a{color:#8f682e}small{display:block;margin-top:18px;color:#66543c}
</style>
</head>
<body>
<main>
<h1>ADZAKO</h1>
<h2>Connexion administrateur</h2>
<p>Connecte-toi avec l'adresse e-mail et le mot de passe de ton compte Supabase.</p>
<form id="login">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Mot de passe</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Se connecter</button>
</form>
<p id="message" role="status">Accès réservé à l'administrateur ADZAKO.</p>
<p><a href="index.html">← Retour à la boutique</a></p>
<small>La clé utilisée ici est la clé publique publishable. Aucun mot de passe n'est enregistré sur cette page.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tdxqniqsotgiryulfyiq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ptl1fYDMKbBKQTOQKatUew_hpUNAUNh";
const ADMIN_UID = "03b053b4-19b8-41c9-b199-6203da70885b";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("login");
const message = document.getElementById("message");
const submit = document.getElementById("submit");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = true;
  message.textContent = "Connexion en cours…";
  const {data, error} = await client.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) {
    message.textContent = "Connexion impossible : " + error.message;
    submit.disabled = false;
    return;
  }
  if (!data.user || data.user.id !== ADMIN_UID) {
    await client.auth.signOut();
    message.textContent = "Ce compte n'est pas autorisé à administrer ADZAKO.";
    submit.disabled = false;
    return;
  }
  message.textContent = "Connexion réussie. Ton compte administrateur est reconnu. La prochaine étape consiste à activer les outils de gestion des produits.";
  form.hidden = true;
});
</script>
</body>
</html>
